<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #fafbfa; /* Very faint light */
            background-image: radial-gradient(rgba(0,0,0,0.03) 2px, transparent 2px);
            background-size: 24px 24px;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #e1e3e2;
            border-radius: 4px;
        }
        
        /* Soft minimalism utility classes */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
        }
        
        .bubble-bounce {
            animation: bubbleBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes bubbleBounce {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-background antialiased flex flex-col h-screen max-w-[768px] mx-auto w-full shadow-[0_0_40px_rgba(0,0,0,0.02)] md:my-8 md:h-[calc(100vh-64px)] md:rounded-[40px] overflow-hidden bg-white/50 backdrop-blur-3xl">

<img alt="AI Assistant Avatar" class="w-full h-full object-cover" data-alt="A close up, friendly and professional portrait of a young woman with a warm smile, serving as an AI assistant avatar. The background is soft and slightly blurred, fitting a modern app aesthetic. Lighting is bright and even, casting soft shadows. 8k, highly detailed, photorealistic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDd2hAlVxq7gXa8orKmn1lW39OMpWO_K74V765slB-HAE5jpKQmYsFXL0QvaY4HGTLUl3prwWMRK6P1x_2V5pulXIK4boMUs5_ox5XINCADkr_wxqU3xpAZif2uKQTBKYFcAZ3f65kMHGtg61-_c1v97wSRxBA2HD03Qn4C3f2H7Ym9Mam8QE2ChumQATE9hMxliF3L-X3G3f8MeosakBOwjEr4AeZJiYm-NNYnJfBNPfsT4ffycObX0ISKjjcqQVtR_Hn81Met8t0"/>
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#9ee0c8] border-2 border-white rounded-full"></div>

<!-- Chat Area -->
<main class="chat-container px-margin-mobile py-6 flex flex-col gap-8" id="chat-box">
<!-- Date Divider -->

<span class="text-xs text-outline/80 font-medium bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-surface-variant/20">今天 10:24 AM 🌸</span>
</div>
<!-- User Message -->
<div class="flex justify-end w-full bubble-bounce" style="animation-delay: 0.1s; animation-fill-mode: both;">
<div class="bg-white/90 backdrop-blur-md text-on-surface p-bubble-padding rounded-3xl rounded-tr-lg max-w-[85%] shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-surface-variant/10 text-chat-bubble font-chat-bubble">
                帮我分析一下上个月的餐饮支出。
            </div>
</div>
<!-- AI Message -->

<div class="flex items-end gap-3">

🤖
</div>

<div>

<button class="mt-5 w-full py-3 bg-white/60 backdrop-blur-sm hover:bg-white/80 text-[#226552] text-xs font-bold rounded-2xl transition-colors flex items-center justify-center gap-1 shadow-[0_2px_8px_rgba(0,0,0,0.02)] border border-[#9ee0c8]/20">

<!-- Bottom Action Area -->

                省钱建议

                导出账单
            </button>
</div>
<!-- Input Bar -->
<div class="flex items-center gap-3 bg-white/90 backdrop-blur-xl rounded-full p-2 pl-4 shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-surface-variant/20 focus-within:border-[#9ee0c8]/50 transition-all">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-outline hover:text-[#226552] hover:bg-surface-container transition-colors shrink-0 bg-surface-container-low/50">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-lg font-body-lg text-on-surface placeholder:text-outline/60 py-3 min-w-0" id="chat-input" placeholder="问我任何财务问题鸭..." type="text"/>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-[#9ee0c8] text-[#002118] hover:scale-105 transition-transform shrink-0 shadow-[0_4px_16px_rgba(158,224,200,0.4)]" id="send-btn">
<span class="material-symbols-outlined text-[24px] ml-1" data-icon="send">send</span>
</button>
</div>

<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
    </style>
<script>
        // Simple script to scroll to bottom on load
        document.addEventListener("DOMContentLoaded", () => {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Interaction for input
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            
            input.addEventListener('input', () => {
                if(input.value.trim().length > 0) {
                    sendBtn.classList.add('scale-110');
                    sendBtn.classList.add('bg-[#aef0d8]');
                    sendBtn.classList.remove('bg-[#9ee0c8]');
                } else {
                    sendBtn.classList.remove('scale-110');
                    sendBtn.classList.remove('bg-[#aef0d8]');
                    sendBtn.classList.add('bg-[#9ee0c8]');
                }
            });
        });
    </script>
